name: Checkout API CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "checkout-api/**"
      - ".github/workflows/ci.yml"

jobs:
  build:
    name: Build Checkout API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: checkout-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: checkout-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build