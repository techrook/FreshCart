name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The exact image tag (commit hash) currently verified in staging'
        required: true
        type: string
      target_environment:
        description: 'The target environment name (e.g., prod)'
        required: true
        default: 'prod'
        type: string

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: checkout-api
  REGISTRY: us-east1-docker.pkg.dev/freshcart-capstone-2234/freshcart-repo

jobs:
  deploy-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    

    environment: production 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/983820798333/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-sa@freshcart-capstone-2234.iam.gserviceaccount.com

      - name: Deploy to Production via IAP SSH
        run: |
          # NOTE: Update this VM name to match your actual production VM 
          # (e.g., freshcart-backend-vm-prod if you ran Terraform with environment="prod")
          VM_NAME="freshcart-backend-vm-prod"
          ZONE="us-east1-c"
          
          # We use the EXACT tag provided in the manual input
          PROMOTED_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
          
          echo "Promoting verified image to production: $PROMOTED_IMAGE"
          
          # SSH through IAP and update the docker container
          gcloud compute ssh $VM_NAME \
            --zone=$ZONE \
            --tunnel-through-iap \
            --command="sudo docker stop checkout-api || true && \
                       sudo docker rm checkout-api || true && \
                       sudo docker run -d --name checkout-api -p 80:3000 $PROMOTED_IMAGE"