services:
  # ==========================================
  # Database Service (Postgres)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: freshcart-db
    environment:
      POSTGRES_DB: freshcart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      # Named volume for database data persistence
      - postgres-data:/var/lib/postgresql/data
      # Automatically seed database schema and initial data
      - ./checkout-api/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - freshcart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freshcart"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # Backend API Service (Express/TypeScript)
  # ==========================================
  checkout-api:
    build:
      context: ./checkout-api
      dockerfile: Dockerfile
    container_name: freshcart-api
    environment:
      # Host name is 'postgres' as resolved by docker DNS on the shared network
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/freshcart
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - freshcart-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # Frontend Service (Vite served via Nginx)
  # ==========================================
  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    container_name: freshcart-storefront
    ports:
      - "8080:8080"
    networks:
      - freshcart-network
    depends_on:
      - checkout-api
    restart: unless-stopped

# Define persistent named volume and shared bridge network
volumes:
  postgres-data:

networks:
  freshcart-network:
    driver: bridge
